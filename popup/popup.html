<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Image Text Translator</title><link rel="stylesheet" href="popup.css"></head>
<body class="popup">
  <header><div class="logo" aria-hidden="true">文A</div><div><h1>Image Text Translator</h1><div class="sub">Local text recognition · Manga & webtoons</div></div></header>
  <main class="body">
    <div class="row"><div><div class="label">Auto-translate</div><div class="hint">Prepares 5 images ahead</div></div><label class="switch"><input type="checkbox" id="auto" aria-label="Translate this page"><span class="slider"></span></label></div>
    <div class="languages"><label>Translate from<select id="sourceLang"><option value="en">English</option><option value="fr">French</option><option value="ar">Arabic</option><option value="ja">Japanese</option><option value="ko">Korean</option><option value="zh">Chinese</option><option value="auto">Multilingual (slower)</option></select></label>
    <label>Translate to<select id="targetLang"><option value="ar">Arabic</option><option value="fr">French</option><option value="en">English</option><option value="ja">Japanese</option><option value="ko">Korean</option><option value="zh">Chinese</option><option value="es">Spanish</option><option value="de">German</option><option value="pt">Portuguese</option><option value="ru">Russian</option><option value="hi">Hindi</option><option value="it">Italian</option></select></label></div>
    <div><div class="label">Display</div><div class="seg" id="mode" role="group" aria-label="Translation display"><button data-mode="overlay" aria-pressed="true" class="active">In-place</button><button data-mode="panel" aria-pressed="false">Reading panel</button></div></div>
    <section class="status-card" aria-live="polite"><div class="row"><strong id="status">Ready</strong><span class="hint" id="count"></span></div><p id="message">Choose the language printed in the image, then turn on translation.</p><progress id="progress" max="100" value="0" hidden></progress></section>
    <div class="actions" id="actions" hidden><button class="btn btn-soft" id="toggleView">Show original</button><button class="btn btn-soft" id="selectArea">Select a missed bubble</button><button class="btn btn-soft" id="retry" hidden>Retry failed images</button></div>
  </main>
  <footer><button class="btn btn-ghost" id="openOptions">Advanced settings →</button><span class="hint">3.1</span></footer>
  <script src="../shared/core.js"></script><script src="popup.js"></script>
</body></html>
